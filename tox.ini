[tox]
min_version = 4.3.5

envlist =
    build{, -minimum}
    coverage-erase
    py{3.15, 3.14, 3.13, 3.12, 3.11}
    mypy-py{3.15, 3.14, 3.13, 3.12, 3.11}
    pyinstaller
    coverage-report
    docs
labels =
    update=update-requirements

skip_missing_interpreters = True
isolated_build = True


[testenv]
package = wheel
wheel_build_env = build_wheel

depends =
    py{3.15, 3.14, 3.13, 3.12, 3.11}: coverage-erase
dependency_groups =
    test
commands =
    coverage run -m pytest


[testenv:build{, -minimum}]
description =
    Test building the project
    minimum: (minimum requirements)
base_python =
    minimum: py3.11
skip_install = true
recreate = true
deps =
    build
    twine
    minimum: setuptools==77.0.3
    !minimum: setuptools
commands =
    python --version
    python -m build --outdir {envdir}/dist/ --no-isolation
    twine check --strict {envdir}/dist/*


[testenv:coverage-erase]
no_package = true
skip_install = true
dependency_groups =
    coverage
commands =
    coverage erase


[testenv:coverage-report]
depends =
    py{3.15, 3.14, 3.13, 3.12, 3.11}
no_package = true
skip_install = true
dependency_groups =
    coverage
commands_pre =
    - coverage combine
commands =
    coverage report
commands_post =
    coverage html --fail-under=0


[testenv:mypy-py{3.15, 3.14, 3.13, 3.12, 3.11}]
deps =
    mypy
commands =
    mypy {posargs}


[testenv:pyinstaller]
description =
    Test PyInstaller apps work
base_python = py3.14
dependency_groups =
    test
    pyinstaller
commands =
    pytest -m pyinstaller {posargs}


[testenv:benchmark]
dependency_groups =
    test
commands =
    pytest --codspeed --verbose --randomly-dont-reorganize --randomly-dont-reset-seed


[testenv:docs]
description = Test building the documentation
base_python = py3.14
skip_install = true
dependency_groups =
deps = -r requirements/docs/requirements.txt
commands =
    sphinx-build -aWEqb html docs/ build/docs


[testenv:update_base]
description = Base settings for update-* environments
base_python = py3.13
recreate = true
skip_install = true


[testenv:update-requirements]
description = Update requirements files
base = update_base
deps =
    poetry
    poetry-plugin-export
commands =
    poetry update --directory="requirements/docs" --lock
    poetry export --directory="requirements/docs" --output="requirements.txt" --without-hashes
